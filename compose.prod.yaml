services:
  php:
    image: psscripts-php:prod
    restart: unless-stopped

  nginx:
    image: psscripts-nginx:prod
    ports:
      - "40071:80"
    depends_on:
      - php
    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - wget
        - "-q"
        - "-O"
        - /dev/null
        - http://127.0.0.1/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
